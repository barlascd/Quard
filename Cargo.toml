[package]
name = "quard"
version = "0.1.0"
edition = "2021"
description = "Zero-trust security decision gateway with an ONNX-based risk scorer"
license = "Apache-2.0"
readme = "README.md"
publish = false

[lib]
name = "quard"
path = "src/lib.rs"

[[bin]]
name = "quard"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }

sha2 = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
subtle = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
