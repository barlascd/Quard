[package]
name = "quard"
version = "0.1.1"
edition = "2021"
description = "Zero-trust security decision gateway with an ONNX-based risk scorer"
license = "MIT"
readme = "README.md"
publish = false

[lib]
name = "quard"
path = "src/lib.rs"

[[bin]]
name = "quard"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }

sha2 = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
subtle = "2"

# Post-quantum cryptography (NIST FIPS 203 ML-KEM, FIPS 204 ML-DSA)
ml-kem = { version = "0.3.4", features = ["getrandom", "zeroize"] }
ml-dsa = { version = "0.1.2", features = ["getrandom"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha3 = "0.10"
rand = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
